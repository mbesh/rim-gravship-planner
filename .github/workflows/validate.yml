name: Required validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Unit and browser UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Chrome for browser validation
        id: chrome
        uses: browser-actions/setup-chrome@48483d551c22a1fe6154c6a195ccc6d5773dc8c4 # v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Required version, unit, and rendered UI validation
        env:
          BROWSER_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm test
      - name: Retain UI screenshots and computed-style reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-validation
          path: artifacts/ui
          retention-days: 7
          if-no-files-found: warn
